name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  database:
    name: Schéma et sécurité (RLS)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Imitation de Supabase
        run: psql -v ON_ERROR_STOP=1 -q -f supabase/tests/supabase_stub.sql
      - name: Application du schéma
        run: psql -v ON_ERROR_STOP=1 -q -f supabase/schema.sql
      - name: Tests d'isolation et de droits
        run: psql -v ON_ERROR_STOP=1 -q -f supabase/tests/rls_test.sql
