name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Bouton « Run workflow » dans l'onglet Actions
  workflow_dispatch:

jobs:
  app:
    name: Application (lint, types, tests, build)
    runs-on: ubuntu-latest
    env:
      # Valeurs factices : le build vérifie seulement leur format (src/lib/env.ts).
      NEXT_PUBLIC_SUPABASE_URL: https://exemple-ci.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_valeur_factice
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  database:
    name: Schéma et sécurité (RLS)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Imitation de Supabase
        run: psql -v ON_ERROR_STOP=1 -q -f supabase/tests/supabase_stub.sql
      - name: Application des migrations
        run: for f in supabase/migrations/*.sql; do psql -v ON_ERROR_STOP=1 -q -f "$f"; done
      - name: Tests d'isolation et de droits
        run: psql -v ON_ERROR_STOP=1 -q -f supabase/tests/rls_test.sql
